<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login — EGO</title>
<link rel="icon" href="../images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="logo" href="../index.html">EGO</a>
    <nav class="main-nav">
      <a href="../index.html">Home</a>
      <a href="../shop.html">Shop</a>
    </nav>
  </div>
</header>

<section class="container" style="padding-top:56px; max-width:420px;">
  <div class="section-heading" style="flex-direction:column; align-items:flex-start; gap:8px;">
    <h2>Admin Login</h2>
  </div>

  <form class="contact-form" id="admin-login-form">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" name="password" required>

    <button class="btn" type="submit" style="width:100%;">Log In</button>
    <p id="login-msg" style="margin-top:16px; font-size:14px; color:#c8102e;"></p>
  </form>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2026 EGO. All rights reserved.</span>
    </div>
  </div>
</footer>

<script src="../js/admin.js"></script>
</body>
</html>
