<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset Password — EGO</title>
<link rel="icon" href="images/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container">
    <a class="logo" href="index.html">EGO</a>
    <nav class="main-nav">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="sale.html">Sale</a>
      <a href="about.html">About</a>
      <a href="contact.html">Contact</a>
    </nav>
    <div class="header-actions">
      <a class="cart-link" href="account.html">Account</a>
      <a class="cart-link" href="cart.html">Cart<span class="cart-count">0</span></a>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
    </div>
  </div>
</header>

<section class="container" style="padding-top:56px; max-width:420px;">
  <div class="section-heading" style="flex-direction:column; align-items:flex-start; gap:8px;">
    <h2>Reset Password</h2>
  </div>

  <form class="contact-form" id="reset-form">
    <label for="new-password">New Password (min 8 characters)</label>
    <input type="password" id="new-password" required minlength="8">

    <button class="btn" type="submit" style="width:100%;">Set New Password</button>
    <p id="reset-msg" style="margin-top:16px; font-size:14px;"></p>
  </form>

  <p id="missing-token-msg" style="display:none; font-size:14px; color:#6b6b6b;">
    This page needs a reset link from your email — please use the link we sent you, or
    <a href="account.html" style="text-decoration:underline;">request a new one</a>.
  </p>
</section>

<footer class="site-footer">
  <div class="container">
    <div class="footer-bottom">
      <span>&copy; 2026 EGO. All rights reserved.</span>
      <span>Designed for those who define themselves.</span>
    </div>
  </div>
</footer>

<script src="js/cart.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    updateCartBadge();

    const token = new URLSearchParams(window.location.search).get("token");
    const form = document.getElementById("reset-form");
    const msg = document.getElementById("reset-msg");

    if (!token) {
      form.style.display = "none";
      document.getElementById("missing-token-msg").style.display = "block";
      return;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      msg.style.color = "#c8102e";
      msg.textContent = "";

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password: document.getElementById("new-password").value })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Unable to reset your password.");

        form.style.display = "none";
        msg.style.color = "#111111";
        msg.innerHTML = 'Your password has been updated. <a href="account.html" style="text-decoration:underline;">Log in</a>.';
      } catch (err) {
        msg.textContent = err.message;
      }
    });
  });
</script>
<script src="js/main.js"></script>
</body>
</html>
